<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b0c">
<title>Zombies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4efe8; --dim:#c9a9a6;
  --bar:#2a0709; --bar-edge:#6e1a1e; --sel:#fff; --sel-ink:#120506;
  --panel-top:#4a0f12; --panel-mid:#7a2023; --panel-low:#5a171a;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --wide:"Michroma","Eurostile","Arial Black",system-ui,sans-serif;
  box-sizing:border-box;
}
*{box-sizing:inherit;margin:0}
html{background:#050b0c}
body{min-height:100vh;min-height:100svh;color:var(--ink);font-family:var(--cond);background:
  radial-gradient(60% 40% at 50% 0%,rgba(70,130,130,.55),transparent 70%),
  radial-gradient(45% 55% at 0% 100%,rgba(120,20,20,.45),transparent 70%),
  radial-gradient(45% 55% at 100% 100%,rgba(120,20,20,.4),transparent 70%),
  radial-gradient(120% 90% at 50% 40%,#17383b 0,#0b1c1e 55%,#040809 100%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.screen{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:calc(1.2rem + env(safe-area-inset-top,0px)) 1rem calc(1.2rem + env(safe-area-inset-bottom,0px))}

/* the red mission panel */
.panel{position:relative;width:min(1120px,100%);border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.65);
  background:
  radial-gradient(18% 22% at 62% 18%,rgba(150,15,15,.7),transparent 70%),
  radial-gradient(14% 18% at 38% 64%,rgba(130,12,12,.5),transparent 70%),
  radial-gradient(22% 20% at 86% 78%,rgba(150,20,20,.45),transparent 70%),
  linear-gradient(180deg,var(--panel-top) 0,var(--panel-mid) 55%,var(--panel-low) 100%)}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px)}
.top{position:relative;z-index:1;padding:clamp(1rem,2.6vw,1.8rem) clamp(1.2rem,3.2vw,2.4rem);background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.12));border-bottom:2px solid rgba(255,255,255,.12)}
.top h1{font-family:var(--wide);font-weight:400;font-size:clamp(1.05rem,2.6vw,1.7rem);letter-spacing:.08em;text-transform:uppercase}
.body{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(1.2rem,3vw,2.4rem);padding:clamp(1.2rem,3vw,2.2rem) clamp(1.2rem,3.2vw,2.4rem) clamp(1.4rem,3vw,2.4rem);min-height:min(62vh,600px)}

/* map list */
.list{display:flex;flex-direction:column;align-self:start}
.row{display:flex;align-items:center;min-height:clamp(44px,5.4vh,52px);padding-left:52px;font-size:clamp(1.35rem,2.5vw,1.95rem);line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);text-decoration:none;cursor:pointer;
  background:linear-gradient(90deg,rgba(14,3,4,.78) 0 36px,var(--bar) 36px);border-bottom:1px solid var(--bar-edge);transition:background-color .12s}
.row span{padding-top:.08em}
.row.sel{background:var(--sel);color:var(--sel-ink)}
.row:focus-visible,.hell:focus-visible,.go:focus-visible,.back:focus-visible{outline:3px solid #ffd34d;outline-offset:2px}
.hell{margin-top:clamp(1.4rem,6vh,3.6rem);font:inherit;font-size:clamp(1.35rem,2.5vw,1.95rem);line-height:1;text-transform:uppercase;text-align:left;border:0;color:var(--ink);cursor:pointer;min-height:clamp(44px,5.4vh,52px);padding:0 0 0 52px;
  background:linear-gradient(90deg,rgba(14,3,4,.78) 0 36px,var(--bar) 36px)}
.hell[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}

/* preview */
.preview{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem;min-width:0}
.preview h2{font-family:var(--wide);font-weight:400;font-size:clamp(1rem,2.3vw,1.6rem);letter-spacing:.07em;text-transform:uppercase;overflow-wrap:anywhere}
.frame{position:relative;width:100%;aspect-ratio:640/460;border-radius:14px;overflow:hidden;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.45)}
.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .18s}
.shot.on{opacity:1}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 40px rgba(0,0,0,.7);pointer-events:none}
.desc{font-size:clamp(1.1rem,1.9vw,1.4rem);line-height:1.22;max-width:34em;min-height:3.7em}
.go{display:inline-block;font-family:var(--wide);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--ink);padding:.8rem 2rem;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.28);transition:background-color .12s,color .12s}
.go:hover{background:var(--sel);color:var(--sel-ink)}

.back{font-family:var(--cond);font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;color:var(--ink);padding:.35rem 1.1rem;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35)}
.back:hover{background:var(--sel);color:var(--sel-ink)}
.fine{font-size:.95rem;color:#9fb3b4;text-align:center}

@media (max-width:780px){
  .body{grid-template-columns:minmax(0,1fr);min-height:0}
  .preview{order:-1}
  .row,.hell{padding-left:44px;background:linear-gradient(90deg,rgba(14,3,4,.78) 0 28px,var(--bar) 28px)}
  .row.sel,.hell[aria-pressed="true"]{background:var(--sel)}
  .desc{min-height:0}
}
@media (prefers-reduced-motion:reduce){.shot,.row,.go{transition:none}}
</style>
</head>

<script>
(function(){
  var MAPS=[{"id": "kino", "name": "Kino der Toten", "desc": "Battle the undead in this theatrical installment of \"Zombies\". New twists and clues could uncover the final plan. It's show time!", "url": "https://vel.gg/bo1z/kino"}, {"id": "five", "name": "\"Five\"", "desc": "The Pentagon is under attack! Washington is going to DEFCON 1 in this installment of \"Zombies\".", "url": "https://vel.gg/bo1z/five"}, {"id": "riese", "name": "Der Riese", "desc": "The Giant is rising. Face the might of the Nazi Zombies in their heartland. This is where the master plan took shape. Is this where it all ends?", "url": "https://vel.gg/bo1z/riese"}, {"id": "nacht", "name": "Nacht der Untoten", "desc": "You drove them deep into the heart of the Reich. You thought they were dead. You were wrong.", "url": "https://vel.gg/bo1z/nacht"}, {"id": "verruckt", "name": "Verrückt", "desc": "Electroshock therapy. Chemically engineered beverages. Hordes of undead Nazis. Find the power to unite and send them back to their graves!", "url": "https://vel.gg/bo1z/verruckt"}, {"id": "shinonuma", "name": "Shi No Numa", "desc": "Maggot ridden corpses. Bug infested swamp. Hundreds of undead Imperial Army. Choose your tactic and defend for your lives!", "url": "https://vel.gg/bo1z/shinonuma"}, {"id": "ascension", "name": "Ascension", "desc": "The risen dead have overtaken a Soviet cosmodrome and all Hell has broken loose. The countdown to the zombie apocalypse has begun.", "url": "https://vel.gg/bo1z/ascension"}, {"id": "cotd", "name": "Call of the Dead", "desc": "A shipwrecked crew of fearless explorers is hopelessly stranded in an abandoned Siberian outpost. Their dream of discovering the true origins of the mysterious Element 115 unravels into a Hellish nightmare.", "url": "https://vel.gg/bo1z/cotd"}, {"id": "shangrila", "name": "Shangri-La", "desc": "A legendary shrine lost in an exotic jungle, where the undead lurk within a treacherous labyrinth of underground caverns, deadly traps and dark secrets.", "url": "https://vel.gg/bo1z/shangrila"}, {"id": "moon", "name": "Moon", "desc": "I believe that this nation should commit itself to achieving the goal, before this decade is out, of landing a man on the moon and returning him safely to the Earth. (JFK, 1961)", "url": "https://vel.gg/bo1z/moon"}];
  var rows=[].slice.call(document.querySelectorAll(".row")),
      shots=[].slice.call(document.querySelectorAll(".shot")),
      pt=document.getElementById("pt"),pd=document.getElementById("pd"),pgo=document.getElementById("pgo"),
      hell=document.getElementById("hell"),cur=-1,touch=window.matchMedia("(hover:none)").matches;
  function pick(i,scroll){
    if(i===cur)return;cur=i;var m=MAPS[i];
    rows.forEach(function(r,j){r.classList.toggle("sel",j===i)});
    shots.forEach(function(s,j){s.classList.toggle("on",j===i)});
    pt.textContent=m.name;pd.textContent=m.desc;pgo.href=m.url;
    pgo.setAttribute("aria-label","Play "+m.name);
    if(scroll)pt.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
  rows.forEach(function(r,i){
    r.addEventListener("mouseenter",function(){if(!touch)pick(i)});
    r.addEventListener("focus",function(){pick(i)});
    r.addEventListener("click",function(e){if(touch&&cur!==i){e.preventDefault();pick(i,true)}});
  });
  document.addEventListener("keydown",function(e){
    if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;
    var n=cur+(e.key==="ArrowDown"?1:-1);if(n<0||n>=rows.length)return;
    e.preventDefault();rows[n].focus();
  });
  hell.addEventListener("click",function(){
    var on=hell.getAttribute("aria-pressed")!=="true";
    hell.setAttribute("aria-pressed",on);hell.textContent="Hell mode: "+(on?"on":"off");
  });
  pick(0);
})();
</script>
